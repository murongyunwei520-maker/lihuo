<!doctype html>

    <meta charset="UTF-8" />
    <!--
      桌面萌宠窗口标记：**必须在任何样式与脚本之前**同步判断。

      该窗口是 transparent + frame:false 的独立 BrowserWindow，只挂着
      `?petOverlay=1` 加载同一份 index.html。若等 Vue 挂载后再给 <html>
      打标记（原先在 App.vue 的 watch 里做），那么：
        1. 浏览器先按默认白底渲染一帧；
        2. main.css 又要等整个 JS 模块图加载完才生效，期间也没有任何样式；
      窗口在这段时间里就是一块不透明底板 —— 用户看到的就是「启动时萌宠区域
      白屏闪一下」。这里提前打标记 + 内联兜底样式，首帧就是透明的。
    -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          if (params.get("petOverlay") === "1") {
            document.documentElement.setAttribute("data-pet-overlay", "");
            window.__PET_OVERLAY__ = true;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* 内联兜底：不等 main.css，首帧就把根节点压成透明 */
      html[data-pet-overlay],
      html[data-pet-overlay] body,
      html[data-pet-overlay] #app {
        background: transparent !important;
        background-color: transparent !important;
        overflow: hidden;
        -webkit-user-select: none;
           -moz-user-select: none;
                user-select: none;
      }
    </style>

    <!-- 首屏同步套用主题属性，避免 Vue 挂载前闪一帧默认色 -->
    <script>
      (function () {
        var SKINS = {
          dark: "dark",
          forest: "dark",
          ocean: "soft",
          cherry: "soft",
          light: "soft",
          cream: "soft",
        };
        var path = location.pathname;
        var isAdmin = path === "/admin-login" || path.indexOf("/admin/") === 0;
        var pref = "cream";
        try {
          var saved = localStorage.getItem("sora2-theme");
          if (saved && (saved === "system" || SKINS[saved])) pref = saved;
        } catch (e) {}
        var applied = pref;
        if (applied === "system") {
          applied =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "cream";
        }
        if (isAdmin) applied = "dark";
        var root = document.documentElement;
        root.setAttribute("data-theme", applied);
        root.setAttribute("data-theme-skin", SKINS[applied] || "dark");
        root.setAttribute("data-theme-scope", isAdmin ? "admin" : "user");
        root.setAttribute("data-theme-preference", pref);
      })();
    </script>

    <!--
      统计：萌宠窗口不加载。
      这原本是一个同步远程 <script>，会阻塞 HTML 解析；萌宠窗口里既没有需要
      采集的行为，也不该为它拖慢首帧。
    -->
