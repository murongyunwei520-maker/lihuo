<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>离火 · 短剧工作室（样板）</title>
<style>
:root{
  --bg:#f4f2f9; --panel:#ffffff; --panel2:#faf9fd; --stroke:#ddd7ea; --stroke-soft:#ece7f6;
  --text:#1a1526; --muted:#655b74; --faint:#b3a9c0;
  --accent:#6b57a8; --accent-soft:#e2daf3; --hover:#f1edf8; --node-fill:#e9e5f2;
  --dot:rgba(80,66,110,.20);
  --ok:#2f8f6b; --warn:#a8681a; --bad:#ad3d3d;
  --warn-bg:#faf3e6; --bad-bg:#fbedec; --info-bg:#efedf7;
}
html[data-theme="dark"]{
  --bg:#0a0810; --panel:#100d1a; --panel2:#141122; --stroke:#241f33; --stroke-soft:#1d1929;
  --text:#ece7f7; --muted:#a99fb8; --faint:#655b74;
  --accent:#b9ace8; --accent-soft:#2c2440; --hover:#1a1626; --node-fill:#141122;
  --dot:rgba(190,170,220,.18);
  --ok:#6fd3a8; --warn:#e0b070; --bad:#e08a8a;
  --warn-bg:#241c10; --bad-bg:#251316; --info-bg:#1a1626;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:13px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{height:100vh;display:flex;flex-direction:column}

/* ---------- 顶栏：极简扁平 ---------- */
.topbar{height:54px;display:flex;align-items:center;gap:16px;padding:0 16px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--panel);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex:0 0 auto}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:13px;font-weight:500;letter-spacing:.01em}
.brand-t span{display:block;font-size:11px;color:var(--faint);line-height:1.3}
.views{display:flex;align-items:center;gap:2px;margin-left:8px}
.view-btn{padding:5px 10px;border-radius:7px;color:var(--muted);font-size:12.5px;transition:background .12s,color .12s}
.view-btn:hover{background:var(--hover);color:var(--text)}
.view-btn.active{background:var(--accent-soft);color:var(--text)}
.spacer{flex:1}
.budget-chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-right:4px}
.budget-chip b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--text)}
.budget-chip .over{color:var(--bad)}
.icon-btn{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.ghost-btn{padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.ghost-btn:hover{background:var(--hover);color:var(--text)}
.primary-btn{padding:6px 14px;border-radius:7px;font-size:12.5px;background:var(--accent);color:#fff}
html[data-theme="dark"] .primary-btn{color:#0a0810}
.primary-btn:hover{opacity:.9}

/* ---------- 视图容器 ---------- */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.active{display:flex}
.hidden{display:none!important}

/* ---------- 分镜表：三栏 ---------- */
#view-board{display:none}
#view-board.active{display:grid;grid-template-columns:344px minmax(0,1fr) 336px;gap:12px;padding:0 12px 12px}
.pane{background:var(--panel);border-radius:12px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pane-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;flex:0 0 auto}
.pane-head h3{font-size:12.5px;font-weight:500;letter-spacing:.02em}
.pane-head .count{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.pane-head .grow{flex:1}
.mini-btn{padding:3px 8px;border-radius:6px;font-size:11.5px;color:var(--muted)}
.mini-btn:hover{background:var(--hover);color:var(--text)}

/* 镜头列表 */
.shot-list{overflow-y:auto;padding:2px 8px 12px;flex:1}
.shot-list::-webkit-scrollbar{width:6px}
.shot-list::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:3px}
.shot{display:flex;gap:10px;padding:8px;border-radius:10px;cursor:pointer;position:relative;transition:background .12s}
.shot:hover{background:var(--hover)}
.shot.sel{background:var(--accent-soft)}
.shot.sel::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--accent)}
.thumb{width:46px;height:82px;border-radius:7px;flex:0 0 auto;overflow:hidden;position:relative;background:var(--node-fill)}
.thumb .bg{position:absolute;inset:0}
.thumb .no{position:absolute;left:4px;top:3px;font-size:10px;font-variant-numeric:tabular-nums;
  color:rgba(255,255,255,.92);letter-spacing:.06em;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.thumb .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.3)}
.thumb .prog i{display:block;height:100%;background:#fff}
.shot-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:1px}
.shot-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.shot-line .sz{color:var(--text)}
.shot-line .dotsep{color:var(--faint)}
.shot-say{font-size:12.5px;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shot-say.empty{color:var(--faint);font-style:normal}
.shot-tail{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);
  background:var(--panel2);border-radius:5px;padding:1px 5px;max-width:100%}
html[data-theme="dark"] .chip{background:var(--hover)}
.chip.asset{color:var(--accent)}
.dur{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;margin-left:auto}
.st{display:inline-flex;align-items:center;gap:4px;font-size:10.5px}
.st i{width:5px;height:5px;border-radius:50%;display:block}
.st.done{color:var(--ok)} .st.done i{background:var(--ok)}
.st.running{color:var(--warn)} .st.running i{background:var(--warn)}
.st.pending{color:var(--faint)} .st.pending i{background:var(--faint)}

/* 中间画布区 */
.stage-wrap{flex:1;min-height:0;position:relative;display:flex;overflow:hidden;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.stage-inner{margin:auto;display:flex;gap:16px;align-items:stretch;padding:18px}
.frame-col{display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.frame{width:236px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;position:relative;background:var(--node-fill);
  box-shadow:0 1px 3px rgba(30,20,60,.06)}
html[data-theme="dark"] .frame{box-shadow:0 1px 4px rgba(0,0,0,.4)}
.frame .bg{position:absolute;inset:0}
.frame .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,16,.30) 0%,rgba(8,6,16,0) 26%,rgba(8,6,16,0) 62%,rgba(8,6,16,.55) 100%)}
.safe{position:absolute;inset:12px;border:1px dashed rgba(255,255,255,.28);border-radius:3px}
.safe::before,.safe::after{content:"";position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.10)}
.safe::before{top:50%} .safe::after{top:50%;transform:rotate(90deg);transform-origin:center;width:100%}
.frame-no{font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.9);
  font-variant-numeric:tabular-nums;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.frame-tag{position:absolute;right:10px;top:10px;font-size:10px;padding:1px 6px;border-radius:4px;
  background:rgba(8,6,16,.55);color:rgba(255,255,255,.86);backdrop-filter:blur(4px)}
.frame-foot{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.frame-scene{font-size:12px;color:rgba(255,255,255,.94);text-shadow:0 1px 4px rgba(0,0,0,.55);line-height:1.35}
.frame-size{font-size:10.5px;color:rgba(255,255,255,.72);letter-spacing:.06em}
.frame-top{position:absolute;left:12px;top:10px;display:flex;gap:6px;align-items:center}
.running-mask{position:absolute;inset:0;background:rgba(8,6,16,.52);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:#fff}
.running-mask .n{font-size:11px;letter-spacing:.06em;opacity:.85}
.ring{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.22);border-top-color:#fff;
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.frame-actions{display:flex;gap:2px;justify-content:center}
.frame-actions button{flex:1;padding:6px 4px;border-radius:7px;font-size:11.5px;color:var(--muted)}
.frame-actions button:hover{background:var(--hover);color:var(--text)}

/* 参数面板 */
.param-col{width:216px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-radius:10px;padding:12px}
.card-t{font-size:11px;letter-spacing:.08em;color:var(--faint);margin-bottom:8px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;font-size:12.5px}
.kv .k{color:var(--muted)}
.kv .v{color:var(--text);font-variant-numeric:tabular-nums}
.kv + .kv{border-top:1px solid var(--stroke-soft)}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:20px;height:20px;border-radius:5px;color:var(--muted);font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:var(--hover);color:var(--text)}
.stepper .v{min-width:34px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.stepper .v.warn{color:var(--bad)}
.say-box{font-size:12.5px;line-height:1.6;color:var(--text);background:var(--panel2);border-radius:8px;
  padding:9px 10px;min-height:56px;outline:none;border:1px solid transparent}
.say-box:focus{border-color:var(--accent)}
html[data-theme="dark"] .say-box{background:var(--hover)}
.say-box.muted{color:var(--faint)}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ref{width:40px;height:40px;border-radius:7px;background:var(--node-fill);position:relative;overflow:hidden;flex:0 0 auto}
.ref .bg{position:absolute;inset:0}
.ref.add{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:14px;background:transparent;
  border:1px dashed var(--stroke)}
.ref.add:hover{border-color:var(--accent);color:var(--accent)}
.ref-hint{font-size:11px;color:var(--faint);margin-top:7px}

/* 底部时长预算 */
.budget{flex:0 0 auto;padding:10px 14px 12px}
.budget-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.budget-head .lbl{font-size:11.5px;color:var(--faint);letter-spacing:.04em}
.budget-head .num{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text)}
.budget-head .num b{font-weight:500}
.budget-head .delta{margin-left:auto;font-size:11px}
.budget-head .delta.bad{color:var(--bad)}
.budget-head .delta.ok{color:var(--ok)}
.bar{height:8px;border-radius:4px;background:var(--panel2);display:flex;overflow:hidden;position:relative}
html[data-theme="dark"] .bar{background:var(--hover)}
.bar .seg{height:100%;transition:opacity .12s;cursor:pointer;box-shadow:inset -0.5px 0 0 rgba(0,0,0,.14)}
.bar .seg:hover{opacity:.75}
.bar .seg.on{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.bar .overlay{position:absolute;top:0;bottom:0;background:rgba(173,61,61,.16);pointer-events:none}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--bad);pointer-events:none}
.bar .mark::after{content:"";position:absolute;top:-1px;left:-2px;width:5px;height:5px;border-radius:1px;background:var(--bad)}
.legend{display:flex;gap:12px;margin-top:7px;font-size:10.5px;color:var(--faint)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* 右侧资产 + 检查器 */
.side-body{overflow-y:auto;padding:0 10px 12px;flex:1}
.side-body::-webkit-scrollbar{width:6px}
.side-body::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:3px}
.asset-row{display:flex;gap:9px;padding:7px 6px;border-radius:9px;align-items:center;cursor:pointer}
.asset-row:hover{background:var(--hover)}
.asset-sheet{width:56px;display:flex;gap:2px;flex:0 0 auto}
.asset-sheet .s{flex:1;aspect-ratio:3/4;border-radius:3px;position:relative;overflow:hidden;background:var(--node-fill)}
.asset-sheet .s .bg{position:absolute;inset:0}
.asset-i{min-width:0;flex:1}
.asset-i .n{font-size:12.5px}
.asset-i .m{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.asset-use{font-size:10.5px;color:var(--faint);flex:0 0 auto}
.lint-row{display:flex;gap:8px;padding:9px 8px;border-radius:9px;cursor:pointer;align-items:flex-start}
.lint-row:hover{background:var(--hover)}
.lint-row.flash{animation:flash .9s ease}
@keyframes flash{0%,100%{background:transparent}30%{background:var(--accent-soft)}}
.lint-ico{width:15px;height:15px;border-radius:4px;flex:0 0 auto;margin-top:1px;font-size:10px;line-height:15px;
  text-align:center;font-weight:500}
.lint-row.bad .lint-ico{background:var(--bad-bg);color:var(--bad)}
.lint-row.warn .lint-ico{background:var(--warn-bg);color:var(--warn)}
.lint-row.info .lint-ico{background:var(--info-bg);color:var(--muted)}
.lint-row.ok .lint-ico{background:var(--info-bg);color:var(--ok)}
.lint-t{font-size:12px;line-height:1.5;color:var(--text)}
.lint-t em{font-style:normal;color:var(--accent);font-variant-numeric:tabular-nums}
.lint-sub{font-size:10.5px;color:var(--faint);margin-top:2px}
.empty-lint{padding:14px 8px;font-size:12px;color:var(--faint);text-align:center}

/* ---------- 时间轴视图 ---------- */
#view-timeline{padding:0 12px 12px;flex-direction:column;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.tl{background:var(--panel);border-radius:12px;flex:0 0 auto;display:flex;flex-direction:column;overflow:hidden}
.tl-head{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;flex:0 0 auto}
.tl-body{flex:1;overflow:auto;padding:4px 16px 16px}
.tl-inner{position:relative}
.ruler{position:relative;height:20px;margin-bottom:6px}
.ruler .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--stroke-soft)}
.ruler .lab{position:absolute;top:3px;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;transform:translateX(3px)}
.track-label{font-size:10px;color:var(--faint);letter-spacing:.1em;margin:10px 0 5px}
.track{display:flex;gap:0;position:relative;height:132px}
.clip{position:relative;border-radius:7px;overflow:hidden;background:var(--node-fill);cursor:pointer;flex:0 0 auto;
  border:1.5px solid transparent;box-shadow:inset -2px 0 0 var(--panel);transition:border-color .12s}
.clip.sel{border-color:var(--accent)}
.clip .bg{position:absolute;inset:0}
.clip .no{position:absolute;left:5px;top:4px;font-size:10px;color:rgba(255,255,255,.9);letter-spacing:.06em;
  text-shadow:0 1px 3px rgba(0,0,0,.5)}
.clip .dur{position:absolute;left:5px;bottom:4px;font-size:10px;color:rgba(255,255,255,.85);margin:0;
  text-shadow:0 1px 3px rgba(0,0,0,.5)}
.clip .pend{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 6px,rgba(255,255,255,.11) 6px 12px)}
.tl-say{height:34px}
.tl-say .say{flex:0 0 auto;background:var(--hover);border-radius:6px;padding:0 8px;font-size:11.5px;color:var(--muted);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;min-width:0;
  box-shadow:inset -2px 0 0 var(--panel)}
html[data-theme="dark"] .tl-say .say{background:var(--hover)}
.tl-say .say.empty{color:var(--faint);justify-content:center;background:transparent;border:1px dashed var(--stroke)}
.tl-audio{height:42px}
.tl-audio .wav{flex:0 0 auto;border-radius:6px;background:var(--hover);position:relative;overflow:hidden;
  box-shadow:inset -2px 0 0 var(--panel)}
html[data-theme="dark"] .tl-audio .wav{background:var(--hover)}
.tl-audio .wav::after{content:"";position:absolute;inset:9px 5px;
  background:repeating-linear-gradient(90deg,var(--stroke) 0 2px,transparent 2px 7px)}
.tl-target{position:absolute;width:1px;background:var(--bad);z-index:6}
.tl-target::after{content:"目标 60s";position:absolute;bottom:-16px;left:4px;font-size:10px;color:var(--bad);white-space:nowrap}
.tl-over{position:absolute;background:rgba(173,61,61,.10);z-index:5;pointer-events:none}
.tl-note{margin-top:14px;font-size:11.5px;color:var(--faint);line-height:1.7}

/* ---------- 自由画布视图 ---------- */
#view-graph{padding:0 12px 12px}
.graph{flex:1;border-radius:12px;background:var(--panel);position:relative;overflow:hidden;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.graph-inner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1020px;height:440px}
.graph svg{position:absolute;inset:0;width:100%;height:100%}
.gnode{position:absolute;border-radius:10px;background:var(--panel);border:1px solid var(--stroke);
  box-shadow:0 1px 3px rgba(30,20,60,.05);overflow:hidden}
html[data-theme="dark"] .gnode{box-shadow:0 1px 4px rgba(0,0,0,.35)}
.gnode .hd{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:11.5px;color:var(--muted);
  border-bottom:1px solid var(--stroke-soft)}
.gnode .hd .d{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.gnode .bd{padding:9px 10px;font-size:12px;line-height:1.5}
.gnode .bd .f{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px}
.gnode .strip{display:flex;gap:2px;padding:0 10px 10px}
.gnode .strip i{flex:1;aspect-ratio:9/16;border-radius:3px;display:block}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">归</div>
      <div class="brand-t">
        <b>《归途》· 第 1 集</b>
        <span>短剧工作室</span>
      </div>
    </div>
    <nav class="views">
      <button class="view-btn active" data-view="board">分镜表</button>
      <button class="view-btn" data-view="timeline">时间轴</button>
      <button class="view-btn" data-view="graph">自由画布</button>
    </nav>
    <div class="spacer"></div>
    <div class="budget-chip" id="budgetChip"></div>
    <button class="icon-btn" id="themeBtn" title="切换主题">◑</button>
    <button class="ghost-btn">分镜 CSV</button>
    <button class="primary-btn">导出成片</button>
  </header>

  <main>
    <section class="view active" id="view-board">
      <div class="pane">
        <div class="pane-head">
          <h3>镜头</h3>
          <span class="count" id="shotCount"></span>
          <div class="grow"></div>
          <button class="mini-btn">＋ 加镜头</button>
        </div>
        <div class="shot-list" id="shotList"></div>
      </div>

      <div class="pane">
        <div class="pane-head">
          <h3 id="stageTitle">镜 01</h3>
          <span class="count" id="stageSub"></span>
          <div class="grow"></div>
          <button class="mini-btn" id="addRefBtn">＋ 挂参考</button>
          <button class="mini-btn">重拍</button>
        </div>
        <div class="stage-wrap">
          <div class="stage-inner">
            <div class="frame-col">
              <div class="frame" id="bigFrame"></div>
              <div class="frame-actions">
                <button>上一镜</button>
                <button>下一镜</button>
                <button>连播</button>
              </div>
            </div>
            <div class="param-col">
              <div class="card">
                <div class="card-t">生成参数</div>
                <div class="kv"><span class="k">模型</span><span class="v">豆包 · 视频</span></div>
                <div class="kv"><span class="k">比例</span><span class="v">9:16</span></div>
                <div class="kv"><span class="k">景别</span><span class="v" id="pSize"></span></div>
                <div class="kv"><span class="k">运镜</span><span class="v" id="pMove"></span></div>
                <div class="kv"><span class="k">光位</span><span class="v" id="pLight"></span></div>
                <div class="kv"><span class="k">时长</span>
                  <span class="stepper">
                    <button data-dur="-1">−</button>
                    <span class="v" id="pDur"></span>
                    <button data-dur="1">＋</button>
                  </span>
                </div>
              </div>
              <div class="card">
                <div class="card-t">台词</div>
                <div class="say-box" id="sayBox" contenteditable="true"></div>
              </div>
              <div class="card">
                <div class="card-t">参考资产</div>
                <div class="refs" id="refRow"></div>
                <div class="ref-hint">挂上角色资产后，跨镜头脸型与服装自动对齐</div>
              </div>
            </div>
          </div>
        </div>
        <div class="budget">
          <div class="budget-head">
            <span class="lbl">时长预算</span>
            <span class="num" id="budgetNum"></span>
            <span class="delta" id="budgetDelta"></span>
          </div>
          <div class="bar" id="bar"></div>
          <div class="legend">
            <span><i style="background:var(--accent)"></i>已出</span>
            <span><i style="background:var(--warn)"></i>生成中</span>
            <span><i style="background:var(--stroke)"></i>待生成</span>
            <span style="margin-left:auto">单镜 4–15s</span>
          </div>
        </div>
      </div>

      <div class="pane">
        <div class="pane-head">
          <h3>资产</h3>
          <span class="count" id="assetCount"></span>
        </div>
        <div class="side-body" id="assetList" style="flex:0 0 auto;overflow:visible"></div>
        <div class="pane-head" style="padding-top:6px">
          <h3>检查器</h3>
          <span class="count" id="lintCount"></span>
        </div>
        <div class="side-body" style="flex:1;max-height:none" id="lintList"></div>
      </div>
    </section>

    <section class="view" id="view-timeline">
      <div class="tl">
        <div class="tl-head">
          <h3 style="font-size:12.5px;font-weight:500">第 1 集 · 时间轴</h3>
          <span class="count" id="tlTotal" style="font-size:11.5px;color:var(--faint)"></span>
          <div class="grow"></div>
          <span style="font-size:11.5px;color:var(--faint)">横向按秒对齐，同一份镜头数据</span>
        </div>
        <div class="tl-body">
          <div class="tl-inner" id="tlInner"></div>
          <div class="tl-note">
            红色为单集目标 60 秒。此处只做「时长校对」与「连播顺序」，不做精剪——真要拖时间轴调帧，再单独立项。
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="view-graph">
      <div class="graph">
        <div class="graph-inner" id="graphInner"></div>
      </div>
    </section>
  </main>
</div>

<script>
const LOOKS = {
  night:  'linear-gradient(165deg,#6b6289 0%,#3d3557 46%,#211c33 100%)',
  street: 'linear-gradient(165deg,#5c6480 0%,#363b4f 55%,#1d2030 100%)',
  close:  'linear-gradient(150deg,#7a6b8c 0%,#493f5c 58%,#241f31 100%)',
  face:   'radial-gradient(120% 90% at 34% 38%,#a892b0 0%,#5f4f70 46%,#2a2038 100%)',
  car:    'linear-gradient(160deg,#8a7560 0%,#4a3b2e 56%,#241c16 100%)',
  rain:   'linear-gradient(170deg,#63769a 0%,#3b475e 55%,#1d2432 100%)'
};

const ASSETS = {
  linwan: { name:'林晚', kind:'角色', looks:['night','face','close'], use:3 },
  chenmo: { name:'陈默', kind:'角色', looks:['car','night','street'], use:1 },
  street: { name:'街口 · 雨夜', kind:'场景', looks:['night','rain','street'], use:4 },
  phone:  { name:'手机', kind:'道具', looks:['close','close','close'], use:1 }
};

const SHOTS = [
  { no:'01', scene:'街口 · 雨夜', size:'全景', move:'固定', dur:8,  status:'done',    cast:['linwan','street'], line:'雨下了一整夜。', look:'night',  light:'left',  lightName:'左逆光' },
  { no:'02', scene:'街口 · 雨夜', size:'中景', move:'推',   dur:9,  status:'done',    cast:['linwan','street'], line:'她撑着伞，忽然回头。', look:'rain',  light:'left',  lightName:'左逆光' },
  { no:'03', scene:'街口 · 雨夜', size:'近景', move:'固定', dur:6,  status:'done',    cast:['phone'],           line:'', look:'close', light:'none',  lightName:'屏幕光' },
  { no:'04', scene:'街口 · 雨夜', size:'特写', move:'手持', dur:5,  status:'running', progress:62, cast:['linwan'], line:'（只有雨声）', look:'face', light:'left',  lightName:'左逆光' },
  { no:'05', scene:'街口 · 雨夜', size:'中景', move:'跟拍', dur:12, status:'pending', cast:['linwan','street'], line:'她挤进人群，谁也没看见她。', look:'night', light:'left', lightName:'左逆光' },
  { no:'06', scene:'马路 · 夜',   size:'全景', move:'摇',   dur:8,  status:'pending', cast:['street'],         line:'一辆出租车停在路口。', look:'street', light:'right', lightName:'右顺光' },
  { no:'07', scene:'车内 · 夜',   size:'近景', move:'固定', dur:7,  status:'pending', cast:['chenmo'],          line:'「上车吧，我等你很久了。」', look:'car', light:'none', lightName:'仪表光' },
  { no:'08', scene:'马路 · 夜',   size:'全景', move:'拉',   dur:9,  status:'pending', cast:['street'],          line:'车走了，雨还没停。', look:'night', light:'left', lightName:'左逆光' }
];

const TARGET = 60;
const MIN_DUR = 4, MAX_DUR = 15;

const LINT = [
  { level:'bad',  shot:7, t:'镜 08 与 <em>镜 06</em> 同为「马路 · 全景」，光位相反（左逆光 / 右顺光）', s:'连播会明显穿帮' },
  { level:'warn', shot:3, t:'镜 04 为<em>特写</em>，但没挂「林晚」参考图', s:'同集已有 2 个该角色镜头，脸型可能不一致' },
  { level:'warn', shot:4, t:'镜 05 时长 <em>12s</em>，接近单镜上限 15s', s:'跟拍运镜建议拆成 2 镜，节奏更稳' },
  { level:'info', shot:2, t:'镜 03 是无台词空镜，<em>6s</em> 偏长', s:'建议压到 4s 以内' }
];

const state = { view:'board', sel:0, theme:'light' };

const total = () => SHOTS.reduce((a,s) => a + s.dur, 0);
const mmss = (n) => Math.floor(n/60) + ':' + String(n%60).padStart(2,'0');

function frameBg(look, light){
  const lx = light === 'right' ? '84%' : '16%';
  const layer = (light && light !== 'none')
    ? '<i style="position:absolute;inset:0;background:radial-gradient(62% 78% at ' + lx + ' 26%,rgba(255,232,196,.30),transparent 72%)"></i>'
    : '<i style="position:absolute;inset:0;background:radial-gradient(50% 60% at 50% 62%,rgba(190,210,255,.20),transparent 70%)"></i>';
  return '<div class="bg" style="background:' + (LOOKS[look] || LOOKS.night) + '">' + layer + '</div>';
}

function renderList(){
  const list = document.getElementById('shotList');
  list.innerHTML = SHOTS.map((s,i) => {
    const sel = i === state.sel ? ' sel' : '';
    const prog = s.status === 'running' ? '<div class="prog"><i style="width:' + s.progress + '%"></i></div>' : '';
    const cast = s.cast.map(k => '<span class="chip asset">' + ASSETS[k].name + '</span>').join('');
    const stText = s.status === 'done' ? '已出' : s.status === 'running' ? '生成中' : '待生成';
    const line = s.line
      ? '<div class="shot-say">' + s.line + '</div>'
      : '<div class="shot-say empty">无台词</div>';
    return '<div class="shot' + sel + '" data-shot="' + i + '">' +
      '<div class="thumb">' + frameBg(s.look, s.light) + '<span class="no">' + s.no + '</span>' + prog + '</div>' +
      '<div class="shot-body">' +
        '<div class="shot-line"><span class="sz">' + s.size + '</span><span class="dotsep">·</span><span>' + s.move + '</span></div>' +
        line +
        '<div class="shot-tail">' + cast + '<span class="st ' + s.status + '"><i></i>' + stText + '</span>' +
        '<span class="dur">' + s.dur + 's</span></div>' +
      '</div>' +
    '</div>';
  }).join('');
  document.getElementById('shotCount').textContent = SHOTS.length + ' 个 · ' + mmss(total());
}

function renderStage(){
  const s = SHOTS[state.sel];
  const f = document.getElementById('bigFrame');
  const mask = s.status === 'running'
    ? '<div class="running-mask"><div class="ring"></div><div class="n">生成中 ' + s.progress + '%</div></div>'
    : '';
  const tag = s.status === 'done' ? '已出片' : s.status === 'running' ? '渲染中' : '待生成';
  f.innerHTML = frameBg(s.look, s.light) +
    '<div class="scrim"></div><div class="safe"></div>' +
    '<div class="frame-top"><span class="frame-no">镜 ' + s.no + '</span></div>' +
    '<div class="frame-tag">' + tag + '</div>' +
    '<div class="frame-foot"><div class="frame-scene">' + s.scene + '</div>' +
    '<div class="frame-size">' + s.size + ' · ' + s.move + '</div></div>' + mask;

  document.getElementById('stageTitle').textContent = '镜 ' + s.no;
  document.getElementById('stageSub').textContent = s.scene + ' · ' + s.dur + 's';
  document.getElementById('pSize').textContent = s.size;
  document.getElementById('pMove').textContent = s.move;
  document.getElementById('pLight').textContent = s.lightName;
  const pd = document.getElementById('pDur');
  pd.textContent = s.dur + 's';
  pd.className = 'v' + (s.dur > 10 ? ' warn' : '');

  const box = document.getElementById('sayBox');
  if (s.line) { box.textContent = s.line; box.classList.remove('muted'); }
  else { box.textContent = '无台词'; box.classList.add('muted'); }

  document.getElementById('refRow').innerHTML =
    s.cast.map(k => '<div class="ref" title="' + ASSETS[k].name + '">' + frameBg(ASSETS[k].looks[0]) + '</div>').join('') +
    '<div class="ref add">＋</div>';
}

function renderAssets(){
  document.getElementById('assetList').innerHTML = Object.values(ASSETS).map(a =>
    '<div class="asset-row"><div class="asset-sheet">' +
      a.looks.map(l => '<div class="s">' + frameBg(l) + '</div>').join('') +
    '</div><div class="asset-i"><div class="n">' + a.name + '</div>' +
    '<div class="m">' + a.kind + ' · 三视图</div></div>' +
    '<div class="asset-use">' + a.use + ' 镜</div></div>'
  ).join('');
  document.getElementById('assetCount').textContent = Object.keys(ASSETS).length + ' 项';
}

function currentLints(){
  const out = LINT.slice();
  const sum = total();
  const over = sum - TARGET;
  if (over > 0) {
    out.unshift({ level:'bad', shot:-1, t:'本集总时长 <em>' + sum + 's</em>，超出目标 ' + TARGET + 's 共 ' + over + 's',
      s:'建议压镜 05 或镜 08，或把目标时长调到 ' + sum + 's' });
  } else {
    out.unshift({ level:'ok', shot:-1, t:'总时长 <em>' + sum + 's</em>，在目标 ' + TARGET + 's 以内', s:'可以交给审片' });
  }
  return out;
}

function renderLint(flashShot){
  const items = currentLints();
  document.getElementById('lintList').innerHTML = items.map((l,i) => {
    const ico = l.level === 'bad' ? '!' : l.level === 'warn' ? '!' : l.level === 'ok' ? '✓' : '·';
    const jump = l.shot >= 0 ? ' data-jump="' + l.shot + '"' : '';
    const flash = flashShot === l.shot && l.shot >= 0 ? ' flash' : '';
    return '<div class="lint-row ' + l.level + flash + '"' + jump + '>' +
      '<div class="lint-ico">' + ico + '</div>' +
      '<div><div class="lint-t">' + l.t + '</div><div class="lint-sub">' + l.s + '</div></div>' +
    '</div>';
  }).join('');
  document.getElementById('lintCount').textContent = items.filter(x => x.level === 'bad' || x.level === 'warn').length + ' 待处理';
}

function renderBudget(){
  const sum = total();
  const bar = document.getElementById('bar');
  const scale = Math.max(sum, TARGET);
  const colors = { done:'var(--accent)', running:'var(--warn)', pending:'var(--stroke)' };
  let html = SHOTS.map((s,i) =>
    '<div class="seg' + (i === state.sel ? ' on' : '') + '" data-shot="' + i + '" title="镜 ' + s.no + ' · ' + s.dur + 's" ' +
    'style="width:' + (s.dur/scale*100) + '%;background:' + colors[s.status] + '"></div>'
  ).join('');
  if (sum > TARGET) {
    html += '<div class="overlay" style="left:' + (TARGET/scale*100) + '%;right:0"></div>';
  }
  html += '<div class="mark" style="left:calc(' + (TARGET/scale*100) + '% - 0.5px)"></div>';
  bar.innerHTML = html;

  document.getElementById('budgetNum').innerHTML = '<b>' + sum + 's</b> / ' + TARGET + 's';
  const d = document.getElementById('budgetDelta');
  const over = sum - TARGET;
  d.className = 'delta ' + (over > 0 ? 'bad' : 'ok');
  d.textContent = over > 0 ? '超 ' + over + 's' : over === 0 ? '刚好' : '余 ' + (-over) + 's';

  const chip = document.getElementById('budgetChip');
  chip.innerHTML = '本集 <b class="' + (over > 0 ? 'over' : '') + '">' + mmss(sum) + '</b> / ' + mmss(TARGET);
}

function renderTimeline(){
  const px = 15;
  const sum = total();
  const w = sum * px;
  let ruler = '';
  for (let t = 0; t <= sum; t += 5) {
    ruler += '<div class="tick" style="left:' + (t*px) + 'px"></div>' +
             '<div class="lab" style="left:' + (t*px) + 'px">' + t + 's</div>';
  }
  const clips = SHOTS.map((s,i) => {
    const st = s.status === 'done' ? '' : s.status === 'running' ? '<div class="pend" style="opacity:.5"></div>' : '<div class="pend"></div>';
    return '<div class="clip' + (i === state.sel ? ' sel' : '') + '" data-shot="' + i + '" title="镜 ' + s.no + ' · ' + s.dur + 's" ' +
      'style="width:' + (s.dur*px) + 'px">' + frameBg(s.look, s.light) + st +
      '<span class="no">' + s.no + '</span><span class="dur">' + s.dur + 's</span></div>';
  }).join('');

  const says = SHOTS.map(s =>
    '<div class="say' + (s.line ? '' : ' empty') + '" style="width:' + (s.dur*px) + 'px" title="' +
    (s.line || '无台词') + '">' + (s.line || '无台词') + '</div>'
  ).join('');

  const wavs = SHOTS.map(s =>
    '<div class="wav" style="width:' + (s.dur*px) + 'px" title="镜 ' + s.no + ' · 环境音 / 台词"></div>'
  ).join('');

  document.getElementById('tlInner').innerHTML =
    '<div style="position:relative;width:' + w + 'px;margin-bottom:22px">' +
      '<div class="ruler" style="width:' + w + 'px">' + ruler + '</div>' +
      '<div class="track-label">画面</div>' +
      '<div class="track" style="width:' + w + 'px">' + clips + '</div>' +
      '<div class="track-label">台词</div>' +
      '<div class="track tl-say" style="width:' + w + 'px">' + says + '</div>' +
      '<div class="track-label">声音</div>' +
      '<div class="track tl-audio" style="width:' + w + 'px">' + wavs + '</div>' +
      (sum > TARGET ? '<div class="tl-over" style="left:' + (TARGET*px) + 'px;right:0;top:20px;bottom:0"></div>' : '') +
      '<div class="tl-target" style="left:' + (TARGET*px) + 'px;top:20px;bottom:0"></div>' +
    '</div>';
  document.getElementById('tlTotal').textContent = '共 ' + sum + 's · 目标 ' + TARGET + 's';
}

function renderGraph(){
  const nodes = [
    { x:20,  y:40,  w:196, h:96,  t:'剧本', sub:'第 1 集 · 4 场 8 镜', body:'雨夜 · 街口 → 车内' },
    { x:20,  y:186, w:196, h:96,  t:'角色资产', sub:'2 个角色', body:'林晚 · 陈默' },
    { x:20,  y:332, w:196, h:64,  t:'场景资产', sub:'1 个场景', body:'街口 · 雨夜' },
    { x:300, y:40,  w:150, h:120, t:'镜 01', sub:'全景 · 固定 · 8s', strip:'night' },
    { x:300, y:190, w:150, h:120, t:'镜 02', sub:'中景 · 推 · 9s', strip:'rain' },
    { x:300, y:340, w:150, h:120, t:'镜 05', sub:'中景 · 跟拍 · 12s', strip:'night' },
    { x:540, y:190, w:170, h:120, t:'生成配置', sub:'豆包 · 9:16', body:'4–15s · 有声 · 带水印' },
    { x:800, y:190, w:180, h:120, t:'第 1 集成片', sub:'8 镜 · 64s', body:'超目标 4s' }
  ];
  const lines = [
    [216,88,300,100],[216,234,300,250],[216,364,300,400],
    [450,100,540,220],[450,250,540,250],[450,400,540,280],
    [710,250,800,250]
  ].map(([x1,y1,x2,y2]) =>
    '<path d="M' + x1 + ' ' + y1 + ' C' + ((x1+x2)/2) + ' ' + y1 + ',' + ((x1+x2)/2) + ' ' + y2 + ',' + x2 + ' ' + y2 + '" ' +
    'fill="none" stroke="var(--faint)" stroke-width="1.2" stroke-linecap="round"/>'
  ).join('');

  const html = '<svg viewBox="0 0 1020 440" preserveAspectRatio="none">' + lines + '</svg>' +
    nodes.map(n => {
      const strip = n.strip
        ? '<div class="strip"><i style="background:' + LOOKS[n.strip] + '"></i><i style="background:' + LOOKS[n.strip] + ';opacity:.7"></i><i style="background:' + LOOKS[n.strip] + ';opacity:.45"></i></div>'
        : '';
      return '<div class="gnode" style="left:' + n.x + 'px;top:' + n.y + 'px;width:' + n.w + 'px">' +
        '<div class="hd"><span class="d"></span>' + n.t + '</div>' +
        '<div class="bd"><div class="f">' + n.sub + '</div>' + (n.body ? '<div style="margin-top:4px;color:var(--muted);font-size:11.5px">' + n.body + '</div>' : '') + '</div>' +
        strip + '</div>';
    }).join('');
  document.getElementById('graphInner').innerHTML = html;
}

function selectShot(i, flash){
  if (i < 0 || i >= SHOTS.length) return;
  state.sel = i;
  renderList(); renderStage(); renderBudget(); renderLint(flash ? i : undefined); renderTimeline();
}

function setView(v){
  state.view = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + v));
  if (v === 'timeline') renderTimeline();
  if (v === 'graph') renderGraph();
}

document.addEventListener('click', (e) => {
  const vb = e.target.closest('.view-btn');
  if (vb) { setView(vb.dataset.view); return; }

  const shotEl = e.target.closest('[data-shot]');
  if (shotEl) { selectShot(Number(shotEl.dataset.shot)); return; }

  const jump = e.target.closest('[data-jump]');
  if (jump) { selectShot(Number(jump.dataset.jump), true); return; }

  const durBtn = e.target.closest('[data-dur]');
  if (durBtn) {
    const s = SHOTS[state.sel];
    const next = s.dur + Number(durBtn.dataset.dur);
    if (next >= MIN_DUR && next <= MAX_DUR) {
      s.dur = next;
      renderList(); renderStage(); renderBudget(); renderLint(); renderTimeline();
    }
    return;
  }
});

document.getElementById('themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = state.theme;
});

renderList(); renderStage(); renderAssets(); renderBudget(); renderLint(); renderTimeline(); renderGraph();

const initialView = location.hash.replace('#','');
if (['board','timeline','graph'].includes(initialView)) setView(initialView);
if (new URLSearchParams(location.search).get('theme') === 'dark') {
  state.theme = 'dark';
  document.documentElement.dataset.theme = 'dark';
}
</script>
</body>
</html>
